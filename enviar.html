<style>
:root{--fundo:#f6f7f9;--texto:#1d2330;--campo:#EBFFFF;--borda:#c9d3dc;--azul:#1f5fa8}
@media (prefers-color-scheme:dark){:root{--fundo:#15181d;--texto:#e8ecf1;--campo:#EBFFFF;--borda:#3a4350;--azul:#6ea8ff}}
html{font-size:16px}body{margin:0;padding:1.5rem 1rem;background:var(--fundo);color:var(--texto);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif}
main{max-width:32rem;margin:0 auto}h1{font-size:1.4rem;margin:0 0 .3rem}p{line-height:1.45}
label{display:block;margin-top:1rem;font-weight:700}input{width:100%;box-sizing:border-box;padding:.6rem;font:inherit;color:#1d2330;background:var(--campo);border:1px solid var(--borda);border-radius:.4rem}
button{margin-top:1.2rem;padding:.65rem 1.2rem;font:inherit;font-weight:700;color:#fff;background:var(--azul);border:0;border-radius:.4rem;cursor:pointer}
.selo{font-size:.8rem;opacity:.7}#st{font-size:1.2rem;font-weight:700}
</style>
</head>
<body><main>
<h1>Envio de alertas 🚗 ALUGUEL</h1><div class="selo">v1.0 · 20-out-26 · 6:00 pm</div>
<section id="cfg" hidden>
<p>Configure uma única vez neste navegador (Chrome do Mac). O telefone e a chave do CallMeBot ficam guardados só aqui e não são enviados a nenhum outro lugar.</p>
<label for="fone">Telefone (com +1 e DDD, só números)</label><input id="fone" autocomplete="off" placeholder="+14795551234">
<label for="chave">Chave do CallMeBot</label><input id="chave" type="password" autocomplete="off">
<button id="salvar">Salvar e enviar teste</button>
</section>
<section id="ok" hidden><p>Configuração salva neste navegador.</p><button id="trocar">Trocar telefone/chave</button></section>
<p id="st"></p>
</main>
<script>
const K="bot_aluguel_callmebot", $=s=>document.querySelector(s);
const ler=()=>{try{return JSON.parse(localStorage.getItem(K)||"null")}catch(e){return null}};
const gravar=v=>{try{localStorage.setItem(K,JSON.stringify(v));return true}catch(e){return false}};
function partes(t,lim=600){const out=[];let a="";for(const l of t.split("\n")){if(a&&a.length+l.length+1>lim){out.push(a);a=""}a=a?a+"\n"+l:l}if(a)out.push(a);return out}
async function enviar(txt){const c=ler();if(!c){document.title="SEM CHAVE";$("#st").textContent="SEM CHAVE: configure abaixo.";$("#cfg").hidden=false;return}
document.title="ENVIANDO";$("#st").textContent="Enviando…";
try{for(const p of partes(txt)){await fetch("https://api.callmebot.com/whatsapp.php?"+new URLSearchParams({phone:c.f,text:p,apikey:c.k}),{mode:"no-cors"});await new Promise(r=>setTimeout(r,4000))}
document.title="ENVIADO";$("#st").textContent="ENVIADO"}catch(e){document.title="ERRO";$("#st").textContent="ERRO no envio"}}
const msg=new URLSearchParams(location.hash.slice(1)).get("m");
if(ler()){$("#ok").hidden=false}else{$("#cfg").hidden=false}
$("#trocar").onclick=()=>{$("#cfg").hidden=false;$("#ok").hidden=true};
$("#salvar").onclick=()=>{const f=$("#fone").value.trim(),k=$("#chave").value.trim();if(!/^\+\d{10,15}$/.test(f)||!k){$("#st").textContent="Confira o telefone (+1…) e a chave.";return}
if(!gravar({f,k})){$("#st").textContent="O navegador não permitiu guardar.";return}$("#fone").value="";$("#chave").value="";$("#cfg").hidden=true;$("#ok").hidden=false;enviar("🚗 ALUGUEL — TESTE\nConfiguração do envio concluída.")};
if(msg&&ler())enviar(msg);else if(msg){document.title="SEM CHAVE";$("#st").textContent="SEM CHAVE: configure abaixo."}
</script>
</body></html>
